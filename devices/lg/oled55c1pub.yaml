roles:
  - role: interactive_local_dashboard_display
    confidence: high
    reason: "LG documents custom webOS application installation and launch through Developer Mode on webOS TV 3.0+; OLED55C1PUB is documented as webOS 6.0 with network connectivity and a 4K display."
  - role: prototype_signage_or_status_surface
    confidence: medium
    reason: "Custom application rendering is a documented platform capability, but Developer Mode is time/session-gated and production distribution has different admission rules."
  - role: always_on_registry_node
    confidence: low
    reason: "General background-service persistence, developer-session durability, cold-boot autostart, active power, storage/RAM headroom, recovery from boot failure, and opportunity cost are not evidence-ready."

evidence:
  overall_state: DOCUMENTED
  locally_verified: false
  last_checked: "2026-09-14"
  claims:
    - id: lg_oled55c1pub_exact_model
      state: DOCUMENTED
      source: "https://www.lg.com/cac/tv-y-barras-de-sonido/lg-oled55c1pub"
      proves:
        - "OLED55C1PUB is a 2021 LG OLED television model using webOS 6.0"
        - "The cited model page documents alpha9 Gen4 4K processing, 3840x2160 OLED display, 802.11ac Wi-Fi, Bluetooth 5.0, three USB 2.0 ports, one Ethernet input, and an RS-232C mini-jack"
        - "The cited regional product page states standby/emergency power below 0.5 W"
      does_not_prove:
        - "RAM or general-purpose CPU architecture/core count"
        - "custom-app access to every physical interface"
        - "whole-device active or idle wall power"
        - "custom app autostart or durable background service behavior"
        - "AXM local reproduction"
    - id: lg_developer_mode_webapp_execution
      state: DOCUMENTED
      source: "https://webostv.developer.lge.com/develop/getting-started/developer-mode-app"
      additional_sources:
        - "https://webostv.developer.lge.com/develop/getting-started/build-your-first-web-app"
        - "https://webostv.developer.lge.com/develop/tools/cli-dev-guide"
      proves:
        - "LG provides a Developer Mode app for actual webOS TVs; its developer documentation says actual-device testing via Developer Mode is available from webOS TV 3.0"
        - "Developer Mode requires an LG Developer site account and network-connected TV"
        - "LG documents packaging a webOS application into an .ipk, installing it to a TV, and launching it with developer tooling"
        - "Developer Mode has a remaining session time and LG documents that the session can be extended while still active"
        - "LG documents Developer Mode disabling after a reboot when session time has expired and after ten reboots while offline; Developer Mode-installed apps are uninstalled when Developer Mode is disabled"
      does_not_prove:
        - "root or unrestricted shell authority"
        - "bootloader access"
        - "production-store admission"
        - "cold-boot application autostart"
        - "fully offline provisioning or indefinite offline persistence"
        - "AXM local reproduction"
    - id: lg_webos6_factory_reset
      state: DOCUMENTED
      source: "https://www.lg.com/us/support/help-library/how-do-i-factory-reset-my-lg-tv-if-it-keeps-freezing-or-showing-errors-CT10000030-20155311398606"
      additional_sources:
        - "https://www.lg.com/us/support/help-library/lg-tv-how-to-reset-my-lg-smart-tv--1441914092672"
      proves:
        - "LG documents Reset to Initial Settings for 2021 webOS 6.0 televisions"
        - "LG says a full reset removes installed apps and personal/account settings and returns the TV to initial settings"
      does_not_prove:
        - "firmware reflash"
        - "recovery from a non-booting or hardware-failed television"
        - "preservation of Developer Mode applications"
        - "AXM local recovery reproduction"

notes:
  - "This record intentionally treats Developer Mode as a real but leased execution surface: arbitrary webOS test apps can be installed and launched, yet the vendor-controlled developer session can expire and its apps are then removed."
  - "This is a new continuity/economics pressure case distinct from Steam Deck update persistence: here the execution surface itself is tied to a renewable developer session/account rather than only to OS update behavior."
  - "A developer account or SSH-key setup does not imply root. The record stays at sandboxed application authority."
  - "The LG standby figure is not converted into active/idle workload power."
  - "No AXM local app installation, power, market, boot, session-expiry, factory-reset, or recovery test has been performed."
