  last_checked: "2026-09-15"
  claims:
    - id: exact_retail_sku_mk2_black
      state: DOCUMENTED
      source: "https://www.elgato.com/pl/pl/s/elgato-product-msrps-by-region"
      additional_sources:
        - "https://www.elgato.com/eu/en/p/stream-deck"
      proves:
        - "Elgato lists retail SKU 10GBA9901 as Stream Deck MK.2 - Black"
        - "Elgato's current 15-key Stream Deck product specification lists 15 customizable LCD keys and USB 2.0 with a USB-C cable"
      does_not_prove:
        - "endpoint CPU, RAM or writable-storage capacity"
        - "developer plugin code executes on the Stream Deck processor"
        - "endpoint shell, root or bootloader authority"
        - "device self-consumption in watts"
    - id: usb_hid_model_and_control
      state: DOCUMENTED
      source: "https://docs.elgato.com/streamdeck/hid/stream-deck-classic/"
      proves:
        - "Elgato identifies Stream Deck Mk.2 as HID model 20GBA9901 with VID 0x0FD9 and PID 0x0080"
        - "Elgato identifies the distinct Mk.2 Scissor Keys variant as model 20GBL9901 with PID 0x00A5"
        - "The 15-key Classic family communicates with the host through USB HID for key-event reporting, image upload and device configuration"
      does_not_prove:
        - "retail SKU and HID model are the same identifier namespace"
        - "developer-controlled code executes on the peripheral"
        - "endpoint root or firmware modification authority"
    - id: plugin_companion_host_execution
      state: DOCUMENTED
      source: "https://docs.elgato.com/streamdeck/sdk/introduction/plugin-environment/"
      proves:
        - "Elgato documents Stream Deck plugins as hosted entirely on the user's local machine"
        - "Elgato documents hardware communication as managed by the Stream Deck app"
        - "The official programmable plugin surface therefore executes developer logic off-endpoint on a companion host"
      does_not_prove:
        - "plugin code executes on the physical Stream Deck endpoint"
        - "the companion-host path works without Stream Deck software"
        - "every plugin works without internet access"
        - "endpoint shell, root or bootloader access"
    - id: firmware_update_risk
      state: DOCUMENTED
      source: "https://help.elgato.com/hc/en-us/articles/4412175612429-Elgato-Stream-Deck-Update-Device-Firmware"
      proves:
        - "Elgato provides a firmware-update path through Stream Deck software"
        - "Elgato warns that an incorrectly completed firmware update may leave a Stream Deck device nonfunctional"
      does_not_prove:
        - "an official low-level unbrick image or rescue bootloader exists"
        - "USB recovery from arbitrary firmware corruption"
        - "AXM locally reproduced firmware update or recovery"
    - id: profile_backup_restore_host_state
      state: DOCUMENTED
      source: "https://help.elgato.com/hc/en-us/articles/360048424432-Elgato-Stream-Deck-How-to-Back-Up-and-Restore-Profiles"
      proves:
        - "Stream Deck software can back up and restore host-side profiles"
        - "Elgato documents profile backup as protection against profile corruption or loss"
      does_not_prove:
        - "physical-device firmware recovery"
        - "profile backups contain plugin binaries or copies"
        - "endpoint state is independently recoverable without the companion host"

notes:
  - "This record promotes the previously researched Stream Deck MK.2 pressure case into the census as a genuinely different programmable peripheral class."
  - "The central lesson is that useful programmable behavior can be real while the developer-controlled execution locus remains entirely on a required companion computer."
  - "No AXM physical Stream Deck was inspected. No plugin was installed, no HID capture was performed, no profile restore or firmware update was attempted, no USB/wall power was measured, and no Tweakers listing was contacted or purchased."
