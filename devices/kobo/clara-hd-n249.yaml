locality:
  state: local_after_provisioning
  vendor_cloud_required_for_basic_operation: unknown
  vendor_cloud_required_for_provisioning: unknown
  local_network_operation: true
  offline_operation: true
  note: "Community native applications and scripts execute locally after installation; Kobo's own setup/account requirements are a separate product-layer question still to research."

economics:
  market_region: unknown
  checked_at: null
  used_price_eur:
    low: unknown
    median: unknown
    high: unknown
  required_adapters_eur: unknown
  setup_minutes: unknown
  special_tools: []
  replacement_availability: unknown
  market_data_state: not_collected

roles:
  - role: offline_script_host
    confidence: high
    reason: "Community tooling demonstrates local native application execution and shell command/script launching on Kobo-class devices, with Clara HD-specific KOReader support evidence."
  - role: low_power_human_machine_display
    confidence: medium
    reason: "E Ink display plus verified custom rendering makes the device interesting for slow-changing local status/UI workloads; refresh/power measurements are not yet collected."
  - role: offline_data_courier
    confidence: medium
    reason: "USB-accessible local storage and local custom execution are documented, but automated transfer behavior still needs testing."
  - role: always_on_infrastructure_node
    confidence: low
    reason: "Unattended boot, long-running networking, sleep behavior and power draw are not yet established for this workload."

evidence:
  overall_state: COMMUNITY_VERIFIED
  locally_verified: false
  last_checked: "2026-09-13"
  claims:
    - id: exact_model_identity
      state: DOCUMENTED
      source: "https://help.kobo.com/hc/en-us/articles/360019127253-Kobo-Clara-HD"
      proves:
        - "Kobo Clara HD model number is N249"
        - "device exposes a power button and USB port"
    - id: official_display_storage_launch_specs
      state: DOCUMENTED
      source: "https://www.kobo.com/news/rakuten-kobo-launches-kobo-clara-hd-its-newest-entry-level-feature-rich-ereader"
      proves:
        - "6-inch 300 ppi HD Carta E Ink display"
        - "8 GB marketed storage"
        - "ComfortLight PRO"
    - id: clara_hd_native_application_execution
      state: COMMUNITY_VERIFIED
      source: "https://github.com/koreader/koreader/issues/15444"
      proves:
        - "KOReader was running on Kobo Clara HD firmware 4.38.23171"
        - "a known-working KOReader build could be restored after a regression"
      does_not_prove:
        - "root privilege"
        - "unattended boot"
        - "support on every firmware version"
    - id: clara_hd_device_support_in_koreader
      state: COMMUNITY_VERIFIED
      source: "https://github.com/koreader/koreader/blob/master/frontend/device/kobo/device.lua"
      proves:
        - "KOReader contains an explicit Kobo Clara HD device definition"
    - id: nickelmenu_command_execution
      state: DOCUMENTED
      source: "https://github.com/pgaskin/NickelMenu"
      proves:
        - "NickelMenu launches custom scripts/actions on Kobo eReaders"
        - "NickelMenu command actions can spawn local processes/shell commands"
      does_not_prove:
        - "Clara HD compatibility on firmware 5.x"
        - "root privilege for every launched command"
    - id: official_manual_reset
      state: DOCUMENTED
      source: "https://help.kobo.com/hc/en-us/articles/360017605314-Manual-reset-your-Kobo-Clara-Colour-Kobo-Clara-BW-Kobo-Clara-HD-Kobo-Nia-Kobo-Elipsa-Kobo-Clara-2E-Kobo-Elipsa-2E"
      proves:
        - "Kobo documents a manual factory-reset path for Clara HD"
        - "the reset removes local content/settings and returns the reader to original settings"

notes:
  - "This record is intentionally useful without needing a precise CPU/RAM claim: the execution surface itself is evidenced."
  - "The e-reader category pressures the schema differently from camera/router records because E Ink, aggressive sleep behavior and human-readable low-refresh output may be valuable while always-on compute may be a poor fit."
  - "No used-market price or measured power data has been collected yet."
