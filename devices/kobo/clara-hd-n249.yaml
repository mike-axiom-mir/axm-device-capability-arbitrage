schema_version: "0.1"
record_id: kobo-clara-hd-n249

identity:
  manufacturer: Rakuten Kobo
  model: Clara HD
  common_name: Kobo Clara HD
  marketed_category: ereader
  hardware_revision: N249

compute:
  soc: unknown
  architecture: unknown
  cpu_cores: unknown
  clock_mhz: unknown
  note: "Community Kobo tooling targets ARM Linux generally, but this record does not promote an exact architecture claim without model-specific hardware evidence."

memory:
  ram_mb: unknown
  internal_persistent_storage_mb: 8000
  storage_marketing_value: "8 GB"
  removable_storage:
    present: unknown
  notes:
    - "Kobo's launch material states 8 GB of storage; usable capacity is lower because system software occupies part of it."

execution:
  surfaces:
    - type: native_binary
      environment: Kobo Linux userspace
      version: "firmware 4.38.23171 in cited working/regression report"
      custom_code: true
      privilege: unknown
      access_method: "KOReader community installation/launcher path"
      state: COMMUNITY_VERIFIED
      notes:
        - "KOReader contains an explicit Kobo Clara HD device definition."
        - "A 2026 KOReader bug report documents Kobo Clara HD firmware 4.38.23171, a regression in newer builds, and rollback to a known working KOReader build."
    - type: shell
      environment: Kobo Linux userspace
      version: unknown
      custom_code: true
      privilege: unknown
      access_method: "NickelMenu cmd_spawn / cmd_output actions"
      state: DOCUMENTED
      notes:
        - "NickelMenu is designed to launch custom scripts and actions on Kobo eReaders."
        - "NickelMenu documentation includes command-spawn examples that execute local shell commands and can start telnetd."
        - "NickelMenu currently states firmware 5.x is not supported; exact firmware compatibility must be checked before deployment."

