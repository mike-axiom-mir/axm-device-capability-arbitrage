schema_version: "0.1"
record_id: wyze-cam-v2

identity:
  manufacturer: Wyze Labs
  model: Wyze Cam v2
  common_name: Wyze Cam v2
  marketed_category: ip_camera
  hardware_revision: variant_dependent
  release_period: unknown
  configuration_scope:
    supported_thingino_variants:
      - soc: Ingenic T20X
        image_sensor: JXF22
        wifi: RTL8189FTV
      - soc: Ingenic T20X
        image_sensor: JXF23
        wifi: RTL8189FTV
    note: "Thingino currently publishes separate exact Wyze Cam v2 builds for JXF22 and JXF23 sensor variants. Claims below are limited to capabilities evidenced for both variants unless explicitly scoped."

compute:
  soc: Ingenic T20X
  architecture: mips_xburst1
  cpu_cores: unknown
  clock_mhz: unknown
  accelerator:
    gpu: unknown
    npu: unknown
    dsp: unknown
  notes:
    - "Thingino's exact Wyze Cam v2 defconfigs select the T20X Ingenic SoC and the XBurst1 core fragment."
    - "No CPU clock or core-count claim is made here because no current exact-model source was collected for those fields."

memory:
  ram_mb: unknown
  internal_persistent_storage_mb: unknown
  removable_storage:
    present: true
    types:
      - microSD
  notes:
    - "Wyze documents microSD local recording and microSD-based stock firmware flashing."
    - "Internal flash capacity and RAM remain unknown in this record."

execution:
  surfaces:
    - type: replaceable_firmware
      environment: Thingino_Linux
      version: stable_branch_current_at_check
      custom_code: true
      privilege: root
      access_method: "Thingino firmware image matched to the physical JXF22 or JXF23 hardware variant"
      state: COMMUNITY_VERIFIED
      notes:
        - "Thingino's current supported-hardware list publishes separate Wyze Cam v2 images for T20X/JXF22/RTL8189FTV and T20X/JXF23/RTL8189FTV."
        - "A real Wyze Cam v2 Thingino deployment is documented in the project issue tracker; this is not a claim that every production unit is the same sensor variant."
    - type: ssh
      environment: Thingino_Linux
      version: unknown
      custom_code: true
      privilege: root
      access_method: "Thingino SSH service after firmware replacement"
      state: COMMUNITY_VERIFIED
      notes:
        - "Thingino documentation describes a Dropbear SSH server, and an exact Wyze Cam v2 issue shows a root shell on a Thingino `wyze_c2_jxf23` build."
        - "Stock Wyze firmware SSH access is not claimed."

connectivity:
  ethernet: unknown
  wifi:
    present: true
    chipset: RTL8189FTV
    custom_code_socket_access: true
    state: COMMUNITY_VERIFIED
  bluetooth: unknown
  usb: unknown
  serial:
    present: unknown
    thingino_recovery_relevance: "UART is a documented generic Thingino installation/recovery method, but exact accessible pads and local procedure were not verified for this unit."
  gpio: unknown

inputs:
  sensors:
    - type: image_sensor
      variants:
        - JXF22
        - JXF23
      resolution: 1920x1080
      accessible_to_custom_code: true
      access_scope: "Thingino camera/streaming pipeline; raw sensor access not asserted"
      state: COMMUNITY_VERIFIED
  microphones:
    - type: built_in_microphone
      accessible_to_custom_code: unknown
  controls:
    - setup_button
  notes:
    - "Wyze documents a built-in microphone and 1080p camera. Thingino maintains separate sensor-specific builds, so the physical sensor must be identified before selecting firmware."

outputs:
  speaker:
    present: true
    custom_audio_verified: unknown
  infrared_leds:
    present: true
    count: 4
    custom_control_verified: unknown
  status_led:
    present: true
    custom_control_verified: unknown
  display:
    present: false
  motors: []
  relays: []

power:
  source:
    battery: false
    external_power: true
  idle_watts: unknown
  active_watts: unknown
  measured: false
  always_on_suitability: unknown
  thermal_notes: unknown
  notes:
    - "No credible exact-model wall-power measurement was collected. USB supply ratings are not substituted for actual consumption."

boot:
  unattended_boot: unknown
  auto_start_custom_code: true
  auto_start_state: COMMUNITY_VERIFIED
  secure_boot: unknown
  boot_from_removable_media: unknown
  bootloader_access: unknown
  notes:
    - "With Thingino installed, the custom firmware itself is the booted operating environment and starts its local services. Cold-power-loss reliability has not been locally tested by AXM."

recovery:
  factory_reset: unknown
  official_restore: true
  rescue_partition: unknown
  dual_firmware: unknown
  removable_media_recovery: true
  usb_recovery: unknown
  uart_recovery: unknown
  bootloader_recovery: unknown
  known_brick_risk: unknown
  recovery_state: DOCUMENTED
  paths:
    - id: official_stock_manual_firmware_flash
      from_state: bootable_stock_wyze_firmware
      target_state: selected_stock_wyze_firmware
      method: microSD_demo_bin_boot_flash
      availability: true
      state: DOCUMENTED
      data_impact:
        system_configuration: unknown
        user_data: unknown
        application_state: unknown
      source_claim_ids:
        - official_stock_manual_firmware_flash
      notes:
        - "Wyze documents a v2-specific `demo.bin` microSD flash flow and automatic reboot."
        - "This claim is scoped to a camera that can still execute the documented stock boot-flash path."
    - id: thingino_full_image_recovery
      from_state: thingino_or_failed_thingino_update
      target_state: thingino_firmware
      method: full_firmware_image_via_supported_hardware_programming_or_bootloader_method
      availability: true
      state: DOCUMENTED
      data_impact:
        system_configuration: unknown
        user_data: unknown
        application_state: unknown
      source_claim_ids:
        - thingino_full_image_and_recovery_methods
      notes:
        - "Thingino documents full images for complete firmware replacement and recovery from serious system failures, with programmer/U-Boot methods depending on hardware access."
        - "No AXM local unbrick test has been performed on Wyze Cam v2."
    - id: return_to_stock_after_thingino
      from_state: thingino_firmware
      target_state: stock_wyze_firmware
      method: unknown
      availability: unknown
      state: UNRESEARCHED
      data_impact:
        system_configuration: unknown
        user_data: unknown
        application_state: unknown
      source_claim_ids:
        - official_stock_manual_firmware_flash
        - thingino_full_image_and_recovery_methods
      notes:
        - "Both stock flashing and Thingino recovery are documented separately, but the gathered evidence does not establish a tested Thingino-to-stock path on Wyze Cam v2. It therefore remains unknown."

locality:
  state: state_dependent
  vendor_cloud_required_for_basic_operation: state_dependent
  vendor_cloud_required_for_provisioning: state_dependent
  local_network_operation: state_dependent
  offline_operation: state_dependent
  states:
    - id: stock_wyze_firmware
      device_state: stock_wyze_firmware
      locality_state: cloud_required_for_some_functions
      state: DOCUMENTED
      offline_capabilities:
        - "continuous microSD recording after prior online setup/configuration"
      internet_required_capabilities:
        - "Wyze app live stream"
        - "Wyze app settings changes"
        - "cloud alert video and app notifications"
      provisioning_cloud_requirement: required
      source_claim_ids:
        - stock_firmware_locality
    - id: thingino_firmware
      device_state: thingino_firmware
      locality_state: fully_local
      state: COMMUNITY_VERIFIED
      offline_capabilities:
        - "LAN web UI"
        - "RTSP streaming"
        - "ONVIF discovery/service"
        - "root SSH administration"
      internet_required_capabilities: []
      provisioning_cloud_requirement: no_vendor_cloud_required_for_runtime
      source_claim_ids:
        - thingino_local_services
        - thingino_exact_v2_execution
  notes:
    - "Locality changes materially with installed firmware. A single device-level cloud/local boolean would erase that distinction."

economics:
  market_region: NL
  checked_at: null
  used_price_eur:
    low: unknown
    median: unknown
    high: unknown
  new_price_eur: unknown
  required_adapters_eur: unknown
  required_storage_eur: unknown
  setup_minutes: unknown
  special_tools:
    - microSD_card_for_official_stock_flash
    - "Thingino installation method depends on the exact unit and may require hardware programming tools"
  replacement_availability: unknown
  market_data_state: not_collected
  notes:
    - "No dated NL/EU used-market sample was collected in this activation."

roles:
  - role: local_ip_camera
    confidence: high
    reason: "Thingino has exact Wyze Cam v2 builds and exposes local camera services including RTSP/ONVIF; the physical JXF22/JXF23 variant must still be matched correctly."
  - role: local_vision_sensor
    confidence: high
    reason: "The 1080p image sensor is exercised by a replaceable open firmware stack; raw-frame APIs beyond the maintained streaming pipeline are not claimed."
  - role: lightweight_edge_node
    confidence: low
    reason: "Root Linux execution exists under Thingino, but RAM, flash headroom, wall power, thermal behavior and workload interference remain unmeasured."
  - role: offline_recorder
    confidence: medium
    reason: "Stock firmware can continue microSD recording offline after setup, while Thingino provides a separate local-first firmware path."

evidence:
  overall_state: COMMUNITY_VERIFIED
  locally_verified: false
  last_checked: "2026-09-14"
  claims:
    - id: exact_hardware_variants
      state: DOCUMENTED
      source: "https://github.com/themactep/thingino-firmware/blob/master/docs/hardware/supported-hardware.md"
      additional_sources:
        - "https://github.com/themactep/thingino-firmware/blob/master/configs/cameras/wyze_cam2_t20x_jxf22_rtl8189ftv/wyze_cam2_t20x_jxf22_rtl8189ftv_defconfig"
        - "https://github.com/themactep/thingino-firmware/blob/master/configs/cameras/wyze_cam2_t20x_jxf23_rtl8189ftv/wyze_cam2_t20x_jxf23_rtl8189ftv_defconfig"
      proves:
        - "Thingino publishes exact Wyze Cam v2 firmware targets for T20X/JXF22/RTL8189FTV and T20X/JXF23/RTL8189FTV"
        - "the exact sensor variant matters when choosing firmware"
      does_not_prove:
        - "which variant a particular second-hand Wyze Cam v2 contains without inspection"
        - "RAM or internal flash capacity"
    - id: thingino_exact_v2_execution
      state: COMMUNITY_VERIFIED
      source: "https://github.com/themactep/thingino-firmware/issues/420"
      additional_sources:
        - "https://github.com/themactep/thingino-firmware/blob/master/docs/hardware/supported-hardware.md"
      proves:
        - "a real Wyze Cam v2 has run Thingino"
        - "the cited deployment identifies a `wyze_c2_jxf23` Thingino build"
        - "the cited exact-device shell is a root shell"
      does_not_prove:
        - "every production Wyze Cam v2 variant is interchangeable"
        - "current Thingino master is appropriate for non-developer use"
    - id: thingino_local_services
      state: DOCUMENTED
      source: "https://blog.thingino.com/finding-your-camera-on-the-lan"
      additional_sources:
        - "https://github.com/themactep/thingino-firmware/blob/master/AGENTS.md"
      proves:
        - "Thingino advertises a LAN Web UI, RTSP service and ONVIF service"
        - "Thingino uses SSH/SCP through a Dropbear server"
      does_not_prove:
        - "every optional Thingino service is enabled in every build"
        - "WAN exposure is required or desirable"
    - id: thingino_full_image_and_recovery_methods
      state: DOCUMENTED
      source: "https://github.com/themactep/thingino-firmware/blob/master/docs/firmware-image-structure.md"
      additional_sources:
        - "https://thingino.com/installation"
      proves:
        - "Thingino full images are used for initial installation, complete firmware replacement and recovery from serious system failures"
        - "programmer, UART/U-Boot, USB-cloner and SD-card methods exist depending on camera support"
      does_not_prove:
        - "a no-tool installer is available for every Wyze Cam v2 production unit"
        - "AXM has locally tested a Wyze Cam v2 unbrick procedure"
    - id: official_stock_manual_firmware_flash
      state: DOCUMENTED
      source: "https://support.wyze.com/hc/en-us/articles/360031490871-How-to-flash-your-Wyze-Cam-firmware-manually"
      proves:
        - "Wyze documents a Wyze Cam v2-specific manual firmware flash using a microSD card and `demo.bin`"
        - "the camera automatically flashes and reboots when the documented boot-button flow succeeds"
      does_not_prove:
        - "the same procedure restores stock after Thingino"
        - "recovery from damaged boot ROM, flash hardware or every bootloader state"
    - id: stock_firmware_locality
      state: DOCUMENTED
      source: "https://support.wyze.com/hc/en-us/articles/360031483211-Can-I-use-my-Wyze-Cam-v2-Pan-without-Wi-Fi"
      additional_sources:
        - "https://support.wyze.com/hc/en-us/articles/33883450378523-Which-Wyze-Cams-can-be-used-without-Wi-Fi"
      proves:
        - "stock Wyze Cam v2 is designed around an internet-connected app experience"
        - "after online setup, configured microSD recording can continue while the camera is offline"
        - "app live view, settings changes and cloud alert behavior are unavailable offline"
      does_not_prove:
        - "stock firmware provides a general local network API"
        - "stock firmware is fully cloud-independent"
    - id: manufacturer_camera_audio_and_storage
      state: DOCUMENTED
      source: "https://www.wyze.com/products/wyze-cam-v2"
      proves:
        - "1920x1080 video, 1/2.9-inch CMOS class camera, four infrared LEDs, built-in speaker and microphone"
        - "microSD continuous recording is supported"
      does_not_prove:
        - "Thingino exposes every audio or LED function"
        - "exact JXF22 versus JXF23 sensor identity for a given physical unit"
    - id: thingino_branch_guidance
      state: DOCUMENTED
      source: "https://github.com/themactep/thingino-firmware"
      proves:
        - "Thingino recommends the stable branch for normal users"
        - "Thingino warns that master uses experimental U-Boot and recommends UART/unbricking skills for contributors"
      does_not_prove:
        - "a particular physical camera has an easy unbrick path"

notes:
  - "This is the first IP-camera census record and raises the census to eight marketed categories."
  - "The main schema lesson is that locality can be device-state dependent: stock firmware and replacement firmware can expose materially different cloud/offline behavior on the same physical machine."
  - "No AXM local flash, power measurement, market-price sample, cold-boot reliability test or Thingino-to-stock recovery test has been performed."
  - "Only owned or explicitly authorized cameras should be modified; camera placement and recording must respect the consent and privacy of affected people."
