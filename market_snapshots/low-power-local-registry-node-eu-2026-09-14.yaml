decision_use:
  ranking_state: partial_market_evidence_only
  facts_supported:
    - "Exact-revision Archer C7 v5 private asking prices in this sample span €20-€40; the sample median is €32."
    - "Wyse 3040 private used asking prices in this sample span €20-€40; the sample median is €29.50, while two NL dealer-refurbished exact configurations are €59 and €67."
    - "DS220+ bare-chassis no-drive listings in this mixed-RAM sample span €195-€279; the sample median is €239.50."
  not_supported:
    - "final transaction-price distributions"
    - "stable or permanent market value"
    - "same-condition acquisition cost after shipping, adapters and required storage"
    - "a total-useful-cost winner"
    - "power, workload, provisioning, restart or remaining-life conclusions"
  next_evidence:
    - "refresh a same-window sample when ranking is attempted"
    - "capture shipping and required accessories separately"
    - "preserve exact Wyse eMMC variant and DS220+ RAM/drive configuration"
    - "combine acquisition evidence only after common workload, power and restart evidence exists"
