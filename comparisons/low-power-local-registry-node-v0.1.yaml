decision_blockers:
  - id: common_workload
    state: not_collected
    note: "The same tiny registry implementation has not been run on all three candidates."
  - id: market_snapshot
    state: partial
    note: "A dated EU snapshot now preserves exact-revision/configuration-aware asking/displayed-listing evidence for all three candidates. It does not prove final transaction prices, shipping-normalized acquisition cost, or a stable market distribution."
  - id: comparable_power
    state: not_collected
    note: "Available manufacturer figures use different conditions and cannot support a fair average-power ranking."
  - id: provisioning_friction
    state: not_collected
    note: "First/repeat provisioning time is not comparable yet."
  - id: power_loss_recovery
    state: not_collected
    note: "End-to-end hard-power-loss -> boot -> registry-service restart has not been tested across the set."
  - id: replacement_supply
    state: not_collected
    note: "Regional replacement availability and configuration consistency are not yet sampled beyond the first acquisition-price observations."

provisional_findings:
  - "Archer C7 v5 currently satisfies every hard field in the capability contract as represented by the census record; this is record-level eligibility, not local workload verification."
  - "Wyse 3040 satisfies the hard contract once a suitable AC Recovery policy is configured; exact used-unit eMMC/WLAN configuration still matters for economics and deployment."
  - "DS220+ is not yet hard-requirement evidence-ready because its basic-runtime vendor-cloud dependency remains unknown; durable state also requires separately counted drives."
  - "The first EU listing snapshot shows distinct observed acquisition bands: Archer C7 v5 exact-revision private asks €20-€40 (median €32), Wyse 3040 private asks €20-€40 (median €29.50), and DS220+ bare-chassis/no-drive mixed-RAM listings €195-€279 (median €239.50). These are sample statistics, not transaction-price truth or total-useful-cost rankings."
  - "No ranked winner is defensible until common workload, power, provisioning and restart evidence exists."

notes:
  - "This is the first machine-readable Layer-C comparison in the repository."
  - "Market observations now live in a separate validated snapshot so listing data can change without becoming permanent device identity."
  - "It deliberately refuses to turn manufacturer power claims, asking-price medians or missing operational evidence into numeric scores."
  - "A future comparison refresh should change statuses only when the underlying device records or directly comparable observations change."
