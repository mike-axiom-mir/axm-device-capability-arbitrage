name: Validate capability records

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate device and contract records
        run: python tools/validate_records.py

      - name: Test execution-locus gate
        run: python tools/test_execution_locus.py

      - name: Validate execution-locus annotations
        run: python tools/validate_execution_locus.py

      - name: Validate evidence claim scope
        run: python tools/validate_evidence_claim_scope.py

      - name: Test generic source-claim link gate
        run: python tools/test_source_claim_links.py

      - name: Validate generic source-claim links
        run: python tools/validate_source_claim_links.py

      - name: Validate evidence packet synchronization
        run: python tools/validate_evidence_packets.py

      - name: Validate evidence source continuity
        run: python tools/validate_evidence_source_continuity.py

      - name: Test Tweakers device-evidence gate
        run: python tools/test_tweakers_device_evidence.py

      - name: Gate Tweakers device-evidence strength
        run: python tools/validate_tweakers_device_evidence.py

      - name: Gate structured evidence strength
        run: python tools/validate_structured_evidence_strength.py

      - name: Validate census state synchronization
        run: python tools/validate_census_state.py

      - name: Validate market snapshots
        run: python tools/validate_market_snapshots.py

      - name: Gate Tweakers market provenance
        run: python tools/validate_tweakers_market_provenance.py

      - name: Validate comparison artifact links
        run: python tools/validate_comparison_artifacts.py

      - name: Gate ranking-ready market evidence window
        run: python tools/validate_market_evidence_window.py

      - name: Validate evidence-gated comparisons
        run: python tools/validate_comparisons.py

      - name: Validate local experiment receipts
        run: python tools/validate_experiment_receipts.py

      - name: Validate local power measurement comparability
        run: python tools/validate_power_measurement_comparability.py

      - name: Test local-verification promotion discriminator
        run: python tools/test_local_verification_promotion.py

      - name: Gate device local-verification promotion
        run: python tools/validate_local_verification_promotions.py

      - name: Build and verify common registry workload
        run: make -C workloads/low-power-local-registry-v0.1 test
